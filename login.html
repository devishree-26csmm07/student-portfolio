<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portfolio - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
    <div class="page-heading">
            <p class="welcome-title">Welcome to student Portfolio</p>
       <div class="main-container">

    
    <div class="inspiration-card">

        <h2>🎓 STUDENT CORNER</h2>

        <h3>Dream • Learn • Achieve</h3>

        <hr>

        <p>
            "Your future is created by what
            you do today, not tomorrow."
        </p>

        <div class="card-bottom">
            ✨ Believe in Yourself ✨
        </div>

    </div>
    <main class="login-box">
       
        <h1>⚡Student Portfolio⚡</h1>
    
        <h2 id="formTitle">Login</h2>

        <form id="loginForm">
            <input type="email" id="loginEmail" placeholder="Email" required>
            <input type="password" id="loginPassword" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>

        <form id="registerForm" class="hidden">
            <input type="text" id="regName" placeholder="Name" required>
            <input type="email" id="regEmail" placeholder="Email" required>
            <input type="text" id="regPhone" placeholder="Phone number" required>
            <input type="password" id="regPassword" placeholder="Password" required>
            <button type="submit">Create Account</button>
        </form>

        <p id="message"></p>
        <p id="switchText">Don't have an account? <a href="#" id="showRegister">Create account</a></p>
        <p class="hidden" id="loginText">Already have an account? <a href="#" id="showLogin">Login</a></p>
    </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
